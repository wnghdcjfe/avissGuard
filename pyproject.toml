[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "avissguard"
version = "0.1.0"
description = "시험장 부정행위 기기(초소형 카메라·이어폰·스마트안경) 블루투스 탐지 대시보드"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "wnghdcjfe", email = "jhc9639@naver.com" }]
keywords = ["bluetooth", "ble", "exam", "proctoring", "cheating-detection", "smart-glasses"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = [
  "bleak>=0.22",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
avissguard = "avissguard.cli:main"

[project.urls]
Homepage = "https://github.com/wnghdcjfe/avissGuard"

[tool.hatch.build.targets.wheel]
packages = ["avissguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
